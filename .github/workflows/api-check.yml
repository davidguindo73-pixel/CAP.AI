name: CAP.AI backend syntax checks

on:
  push:
    branches:
      - feature/full-platform-foundation
      - rebuild/advertising-company-backend
  pull_request:
    branches:
      - rebuild/advertising-company-backend
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: api
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check api/server.js
          node --check api/platform.js
          node --check api/ads.js
          node --check api/db.js
          node --check assets/ads.js
          node --check assets/workspace.js
      - name: Check Create AI inline script
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html = fs.readFileSync('create.html', 'utf8'); const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map((match) => match[1]); if (!scripts.length) throw new Error('No inline Create AI script found'); fs.writeFileSync('/tmp/create-ai-inline.js', scripts.join('\\n'));"
          node --check /tmp/create-ai-inline.js
