services:
  - type: web
    name: cap-ai-generation-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://davidguindo73-pixel.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AD_MODEL
        value: gpt-4.1-mini
      - key: CAP_ADS_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
